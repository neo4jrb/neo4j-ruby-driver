name: Release

# How to cut a release:
#   1. Bump VERSION in lib/shared/neo4j/driver/version.rb and move the
#      CHANGELOG's [Unreleased] entries under a new version heading.
#   2. Commit, then tag and push:
#        git tag v<version> && git push origin v<version>
#
# On a `v*` tag this workflow creates (publishes) a GitHub Release with notes
# generated from the pull requests merged since the previous tag (marked
# pre-release for versions carrying a prerelease token such as v6.2.1.beta.1),
# and — when a RUBYGEMS_API_KEY secret is configured — builds and pushes both
# platform gems (MRI + JRuby). Without that secret the gems are still built (a
# release smoke test) but not pushed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Pre-release when the version carries a prerelease token (a letter),
          # e.g. v6.2.1.beta.1 or v6.2.1-rc.1. Strip the leading v first so the
          # v itself isn't counted.
          prerelease=
          case "${tag#v}" in *[a-zA-Z]*) prerelease=--prerelease ;; esac
          # Idempotent: skip creation if a release for this tag already exists,
          # so re-running the workflow (e.g. after a publish hiccup) is safe.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping creation."
          else
            gh release create "$tag" --title "$tag" --generate-notes $prerelease
          fi

  # Publish the JRuby (java platform) gem BEFORE the MRI (ruby platform) gem.
  # The ruby-platform gem is the universal fallback: if it were on RubyGems for
  # a version whose java gem wasn't published yet, a JRuby user resolving that
  # version would install it — i.e. get the MRI implementation instead of the
  # Java-driver wrapper. There is no symmetric risk (the java gem never installs
  # on MRI), so publishing java first closes the window. If the java push fails,
  # `needs` stops the ruby push, so the ruby gem is never the only variant.
  publish-jruby:
    name: Build & push (JRuby / java)
    needs: github-release
    runs-on: ubuntu-latest
    env:
      # A boolean, never the key itself — safe at job scope, and used only to
      # gate the push step. The key is injected on that step alone.
      HAS_RUBYGEMS_KEY: ${{ secrets.RUBYGEMS_API_KEY != '' }}
      BUNDLE_JOBS: '1' # jar-dependencies' post_install hook races under parallel installs
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.1.0.0
          bundler-cache: true
      - name: Build the JRuby gem
        run: bundle exec rake build:jruby
      - name: Push to RubyGems
        # Skipped (build-only) when no RubyGems key is configured.
        if: env.HAS_RUBYGEMS_KEY == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push pkg/*.gem

  publish-mri:
    name: Build & push (MRI / ruby)
    needs: publish-jruby # only after the java gem is on RubyGems
    runs-on: ubuntu-latest
    env:
      HAS_RUBYGEMS_KEY: ${{ secrets.RUBYGEMS_API_KEY != '' }}
      BUNDLE_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build the MRI gem
        run: bundle exec rake build:mri
      - name: Push to RubyGems
        if: env.HAS_RUBYGEMS_KEY == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push pkg/*.gem
