# Reek baseline. Like .rubocop_todo.yml: the `detectors:` exclude lists below
# grandfather the smells that existed when reek was introduced, so CI is green
# on current code and fails only on NEW smells. Regenerate after cleanup with
# `bundle exec reek --todo lib/` (shrink it over time; don't let it grow).
---
exclude_paths:
  # Generated at build time from Jars.lock (rake build:jruby) — not hand-written.
  - lib/jruby/neo4j-ruby-driver_jars.rb
detectors:
  Attribute:
    exclude:
    - Neo4j::Driver::Bolt::Connection#auth_epoch
    - Neo4j::Driver::Bolt::Connection#auth_failed
    - Neo4j::Driver::Bolt::Connection#created_at
    - Neo4j::Driver::Bolt::Connection#discard_on_release
    - Neo4j::Driver::Bolt::Connection#idle_since
    - Neo4j::Driver::Bolt::Connection#security_exception_handler
    - Neo4j::Driver::Bolt::Connection#session_scoped_auth
    - Neo4j::Driver::PackStream::Packer#use_utc_datetime
    - Neo4j::Driver::Routing::RoutedConnection#discard_on_release
  BooleanParameter:
    exclude:
    - Neo4j::Driver::Ext::NeoConverter#to_neo
    - Neo4j::Driver::Bolt::Connection#authenticate
    - Neo4j::Driver::Bolt::Connection#reset!
    - Neo4j::Driver::Direct::ConnectionProvider#on_security_exception
    - Neo4j::Driver::Routing::LoadBalancer#on_security_exception
    - Neo4j::Driver::Summary::ResultSummary#initialize
    - Neo4j::Driver::UnmanagedTransaction#initialize
  ControlParameter:
    exclude:
    - Neo4j::Driver::Ext::ExceptionMapper#mapped_neo4j_exception_class
