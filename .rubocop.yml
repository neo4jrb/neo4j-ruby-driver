plugins:
  - rubocop-performance

inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'testkit/**/*'         # external conformance suite, not our code
    - 'tmp/**/*'
    - 'vendor/**/*'
    - 'pkg/**/*'             # staged/flattened gem build output (git-ignored)
    - 'lib/**/*_jars.rb'     # generated by lock_jars (git-ignored)

# Standard arithmetic precedence is unambiguous; don't force parens around
# `a * b + c` and friends.
Lint/AmbiguousOperatorPrecedence:
  Enabled: false

# The method-reference idiom (`&Bookmark.method(:new)`, `&method(:foo)`) is a
# documented house style (see CLAUDE.md "Ruby 3.4+ idioms"); this cop would
# rewrite every such reference into an explicit block, so disable it.
Performance/MethodObjectAsBlock:
  Enabled: false
